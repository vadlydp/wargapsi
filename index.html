<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WargaKita Pro - Sistem Informasi RT/RW Digital</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18 & React-DOM UMD (Production Version) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
  <div id="root"></div>
<script>
    const e = React.createElement;
    const { useState, useEffect, useMemo } = React;

    // --- INITIAL MOCK DATA ---
    const INITIAL_WARGA = [
      { id: 1, nik: '3276011203850001', nama: 'Budi Santoso', blok: 'A1-05', hp: '081234567890', status: 'Tetap', anggota: 4, pekerjaan: 'Karyawan Swasta' },
      { id: 2, nik: '3276012408900002', nama: 'Siti Rahmawati', blok: 'A1-08', hp: '081987654321', status: 'Tetap', anggota: 3, pekerjaan: 'PNS / ASN' },
      { id: 3, nik: '3276010511880003', nama: 'Ahmad Dahlan', blok: 'B2-12', hp: '085678901234', status: 'Kontrak', anggota: 2, pekerjaan: 'Wiraswasta' },
      { id: 4, nik: '3276011902920004', nama: 'Dr. Dian Sastro', blok: 'B2-15', hp: '087812345678', status: 'Tetap', anggota: 5, pekerjaan: 'Tenaga Medis' },
      { id: 5, nik: '3276013007870005', nama: 'Eko Prasetyo', blok: 'C3-01', hp: '081398765432', status: 'Kontrak', anggota: 1, pekerjaan: 'Software Engineer' }
    ];

    const INITIAL_KAS = [
      { id: 1, tanggal: '2026-11-01', jenis: 'Masuk', kategori: 'Iuran Warga', nominal: 1850000, keterangan: 'Penerimaan Iuran Kebersihan & Keamanan Blok A (Nov)' },
      { id: 2, tanggal: '2026-11-02', jenis: 'Keluar', kategori: 'Pemeliharaan', nominal: 420000, keterangan: 'Perbaikan Penerangan Pintu Pos Barat' },
      { id: 3, tanggal: '2026-10-28', jenis: 'Masuk', kategori: 'Donasi', nominal: 750000, keterangan: 'Sumbangan Usaha UMKM Kegiatan Warga' },
      { id: 4, tanggal: '2026-10-25', jenis: 'Keluar', kategori: 'Kebersihan', nominal: 650000, keterangan: 'Honor Pengangkutan Sampah Musiman' }
    ];

    const INITIAL_KEGIATAN = [
      { id: 1, nama: 'Kerja Bakti Lingkungan & Reboisasi', tanggal: '2026-11-08', waktu: '07:00 - 10:30 WIB', lokasi: 'Taman Publik Blok B', pj: 'Seksi Lingkungan', anggaran: 'Rp 400.000', status: 'Mendatang' },
      { id: 2, nama: 'Musyawarah Triwulan Warga RT 04', tanggal: '2026-11-14', waktu: '19:30 WIB - Selesai', lokasi: 'Balai Warga Utama', pj: 'Pengurus RT 04', anggaran: 'Rp 250.000', status: 'Mendatang' }
    ];

    const INITIAL_INFO = [
      { id: 1, judul: 'Jadwal Penyesuaian Pengambilan Sampah', tanggal: '2026-11-01', prioritas: 'Penting', penulis: 'Sekretariat RT', isi: 'Berhubung adanya libur nasional, pengangkutan sampah rumah tangga dimajukan satu hari lebih awal.' },
      { id: 2, judul: 'Himbauan Kamtibmas & Pengetatan Portal Malam', tanggal: '2026-10-29', prioritas: 'Urgent', penulis: 'Koordinator Keamanan', isi: 'Portal akses utama akan dikunci otomatis mulai pukul 22:30 WIB.' }
    ];

    const INITIAL_PENGADUAN = [
      { id: 1, tanggal: '2026-11-01', pelapor: 'Ahmad Dahlan (B2-12)', kategori: 'Infrastruktur', judul: 'Lampu Penerangan Jalan Utama Blok B2 Padam', status: 'Diproses', respon: 'Tim teknisi telah dihubungi dan dijadwalkan perbaikan sore ini.' }
    ];

    const INITIAL_DARURAT = [
      { id: 1, nama: 'Pos Keamanan Utama (Satpam 24 Jam)', hp: '0812-9988-7766', deskripsi: 'Siaga 24 Jam - Gerbang Utama' },
      { id: 2, nama: 'Ketua RT 04 (Bpk. Budi Santoso)', hp: '0812-3456-7890', deskripsi: 'Pelayanan Administrasi Warga' },
      { id: 3, nama: 'Layanan Ambulans & Gawat Darurat', hp: '118', deskripsi: 'Penanganan Medis Darurat Kritis' },
      { id: 4, nama: 'Polsek Sektor Perumahan', hp: '110', deskripsi: 'Laporan Gangguan Keamanan' }
    ];

    function App() {
      const [warga, setWarga] = useState(() => JSON.parse(localStorage.getItem('wk_warga')) || INITIAL_WARGA);
      const [kas, setKas] = useState(() => JSON.parse(localStorage.getItem('wk_kas')) || INITIAL_KAS);
      const [kegiatan, setKegiatan] = useState(() => JSON.parse(localStorage.getItem('wk_kegiatan')) || INITIAL_KEGIATAN);
      const [info, setInfo] = useState(() => JSON.parse(localStorage.getItem('wk_info')) || INITIAL_INFO);
      const [pengaduan, setPengaduan] = useState(() => JSON.parse(localStorage.getItem('wk_pengaduan')) || INITIAL_PENGADUAN);
      const [darurat, setDarurat] = useState(() => JSON.parse(localStorage.getItem('wk_darurat')) || INITIAL_DARURAT);

      const [activeTab, setActiveTab] = useState('dashboard');
      const [isAdmin, setIsAdmin] = useState(true);
      const [searchWarga, setSearchWarga] = useState('');
      const [showModalWarga, setShowModalWarga] = useState(false);
      const [formWarga, setFormWarga] = useState({ nik: '', nama: '', blok: '', hp: '', status: 'Tetap', anggota: 1, pekerjaan: '' });

      useEffect(() => {
        localStorage.setItem('wk_warga', JSON.stringify(warga));
        localStorage.setItem('wk_kas', JSON.stringify(kas));
        localStorage.setItem('wk_kegiatan', JSON.stringify(kegiatan));
        localStorage.setItem('wk_info', JSON.stringify(info));
        localStorage.setItem('wk_pengaduan', JSON.stringify(pengaduan));
        localStorage.setItem('wk_darurat', JSON.stringify(darurat));
      }, [warga, kas, kegiatan, info, pengaduan, darurat]);

      const totalMasuk = kas.filter(k => k.jenis === 'Masuk').reduce((acc, c) => acc + c.nominal, 0);
      const totalKeluar = kas.filter(k => k.jenis === 'Keluar').reduce((acc, c) => acc + c.nominal, 0);
      const saldoKas = totalMasuk - totalKeluar;

      const formatRupiah = (val) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(val);

      const filteredWarga = warga.filter(w => 
        w.nama.toLowerCase().includes(searchWarga.toLowerCase()) || 
        w.blok.toLowerCase().includes(searchWarga.toLowerCase()) ||
        w.nik.includes(searchWarga)
      );

      const handleAddWarga = (ev) => {
        ev.preventDefault();
        setWarga([...warga, { ...formWarga, id: Date.now() }]);
        setFormWarga({ nik: '', nama: '', blok: '', hp: '', status: 'Tetap', anggota: 1, pekerjaan: '' });
        setShowModalWarga(false);
      };

      const handleDeleteWarga = (id) => {
        if (confirm("Apakah Anda yakin ingin menghapus data warga ini?")) {
          setWarga(warga.filter(w => w.id !== id));
        }
      };

      return e('div', { className: 'min-h-screen flex flex-col md:flex-row bg-slate-50' },
        // SIDEBAR
        e('aside', { className: 'w-full md:w-64 bg-slate-900 text-slate-300 p-5 flex flex-col justify-between shrink-0 shadow-lg' },
          e('div', null,
            e('div', { className: 'flex items-center space-x-3 mb-8' },
              e('div', { className: 'w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold text-lg shadow-md' }, 'W'),
              e('div', null,
                e('h1', { className: 'font-bold text-base text-white tracking-tight' }, 'WargaKita Pro'),
                e('p', { className: 'text-[11px] text-slate-400 font-medium' }, 'RT 04 / RW 09 Online')
              )
            ),
            e('nav', { className: 'space-y-1' },
              [
                { id: 'dashboard', label: 'Overview', icon: '📊' },
                { id: 'warga', label: 'Data Warga', icon: '👥' },
                { id: 'kas', label: 'Laporan Kas', icon: '💳' },
                { id: 'kegiatan', label: 'Kegiatan RT', icon: '📅' },
                { id: 'info', label: 'Pengumuman', icon: '📢' },
                { id: 'pengaduan', label: 'Helpdesk', icon: '🔔' },
                { id: 'darurat', label: 'Kontak Darurat', icon: '📞' }
              ].map(tab => 
                e('button', {
                  key: tab.id,
                  onClick: () => setActiveTab(tab.id),
                  className: `w-full flex items-center space-x-3 px-3 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                    activeTab === tab.id ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'
                  }`
                },
                  e('span', null, tab.icon),
                  e('span', null, tab.label)
                )
              )
            )
          ),
          e('div', { className: 'pt-4 border-t border-slate-800' },
            e('div', { className: 'p-3 rounded-xl bg-slate-800/80 border border-slate-700/60 flex items-center justify-between text-xs' },
              e('div', null,
                e('p', { className: 'font-semibold text-slate-200' }, 'Hak Akses'),
                e('p', { className: 'text-[10px] text-slate-400' }, isAdmin ? 'Mode Admin / Pengurus' : 'Mode Warga Biasa')
              ),
              e('input', {
                type: 'checkbox',
                checked: isAdmin,
                onChange: () => setIsAdmin(!isAdmin),
                className: 'w-4 h-4 accent-emerald-600 cursor-pointer'
              })
            )
          )
        ),

        // MAIN CONTENT CONTAINER
        e('main', { className: 'flex-1 p-5 md:p-8 overflow-y-auto max-w-7xl mx-auto w-full' },
          // Header Bar
          e('header', { className: 'flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs' },
            e('div', null,
              e('h2', { className: 'text-lg font-bold text-slate-900 capitalize' }, `Modul ${activeTab}`),
              e('p', { className: 'text-xs text-slate-400' }, 'Sistem Informasi Pengelolaan Lingkungan Perumahan')
            ),
            e('div', { className: 'flex items-center space-x-2' },
              e('span', { className: `text-[11px] font-semibold px-3 py-1 rounded-full border ${isAdmin ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-slate-100 text-slate-600 border-slate-200'}` },
                isAdmin ? ' Mode Pengurus Aktif' : ' Access Only (Warga)'
              )
            )
          ),

          // TAB: DASHBOARD
          activeTab === 'dashboard' && e('div', { className: 'space-y-6' },
            e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4' },
              e('div', { className: 'bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs' },
                e('p', { className: 'text-xs text-slate-400 font-medium' }, 'TOTAL WARGA'),
                e('h3', { className: 'text-2xl font-bold text-slate-900 mt-1' }, `${warga.length} Jiwa`),
                e('p', { className: 'text-[11px] text-emerald-600 mt-1 font-medium' }, 'Terdaftar di database RT')
              ),
              e('div', { className: 'bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs' },
                e('p', { className: 'text-xs text-slate-400 font-medium' }, 'SALDO KAS RT'),
                e('h3', { className: 'text-xl font-bold text-emerald-600 mt-1' }, formatRupiah(saldoKas)),
                e('p', { className: 'text-[11px] text-slate-400 mt-1' }, `Masuk: ${formatRupiah(totalMasuk)}`)
              ),
              e('div', { className: 'bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs' },
                e('p', { className: 'text-xs text-slate-400 font-medium' }, 'AGENDA KEGIATAN'),
                e('h3', { className: 'text-2xl font-bold text-slate-900 mt-1' }, `${kegiatan.length} Acara`),
                e('p', { className: 'text-[11px] text-slate-400 mt-1' }, 'Mendatang bulan ini')
              ),
              e('div', { className: 'bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs' },
                e('p', { className: 'text-xs text-slate-400 font-medium' }, 'PENGADUAN AKTIF'),
                e('h3', { className: 'text-2xl font-bold text-amber-600 mt-1' }, `${pengaduan.filter(p=>p.status!=='Selesai').length} Laporan`),
                e('p', { className: 'text-[11px] text-amber-600 mt-1' }, 'Perlu perhatian pengurus')
              )
            ),

            e('div', { className: 'grid grid-cols-1 lg:grid-cols-2 gap-6' },
              e('div', { className: 'bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs space-y-3' },
                e('h4', { className: 'font-bold text-sm text-slate-900 border-b pb-2' }, 'Pengumuman Terbaru'),
                info.map(i => e('div', { key: i.id, className: 'p-3 bg-slate-50 rounded-xl border border-slate-100 space-y-1' },
                  e('div', { className: 'flex justify-between items-center text-[10px]' },
                    e('span', { className: 'font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded border border-amber-200' }, i.prioritas),
                    e('span', { className: 'text-slate-400' }, i.tanggal)
                  ),
                  e('h5', { className: 'font-semibold text-xs text-slate-800' }, i.judul),
                  e('p', { className: 'text-xs text-slate-500 line-clamp-2' }, i.isi)
                ))
              ),
              e('div', { className: 'bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs space-y-3' },
                e('h4', { className: 'font-bold text-sm text-slate-900 border-b pb-2' }, 'Agenda Mendatang'),
                kegiatan.map(k => e('div', { key: k.id, className: 'p-3 bg-slate-50 rounded-xl border border-slate-100 space-y-1' },
                  e('span', { className: 'text-[10px] bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded font-semibold border border-emerald-200' }, k.status),
                  e('h5', { className: 'font-semibold text-xs text-slate-800' }, k.nama),
                  e('p', { className: 'text-xs text-slate-500' }, `📅 ${k.tanggal} • 📍 ${k.lokasi}`)
                ))
              )
            )
          ),

          // TAB: DATA WARGA
          activeTab === 'warga' && e('div', { className: 'space-y-4' },
            e('div', { className: 'flex flex-col sm:flex-row justify-between items-center gap-3' },
              e('input', {
                type: 'text',
                placeholder: 'Cari Nama, NIK, atau Blok...',
                value: searchWarga,
                onChange: (ev) => setSearchWarga(ev.target.value),
                className: 'w-full sm:w-72 px-3.5 py-1.5 text-xs rounded-xl border border-slate-200 focus:outline-none focus:ring-1 focus:ring-emerald-500 bg-white'
              }),
              isAdmin && e('button', {
                onClick: () => setShowModalWarga(true),
                className: 'w-full sm:w-auto px-4 py-2 text-xs font-semibold bg-emerald-600 text-white rounded-xl hover:bg-emerald-700 transition shadow-xs'
              }, '+ Tambah Data Warga')
            ),

            e('div', { className: 'bg-white rounded-2xl border border-slate-200/90 overflow-hidden shadow-xs' },
              e('div', { className: 'overflow-x-auto' },
                e('table', { className: 'w-full text-left text-xs border-collapse' },
                  e('thead', { className: 'bg-slate-50 border-b border-slate-200 text-slate-500 font-semibold' },
                    e('tr', null,
                      e('th', { className: 'p-3 pl-4' }, 'Nama / NIK'),
                      e('th', { className: 'p-3' }, 'Blok'),
                      e('th', { className: 'p-3' }, 'No. Telepon'),
                      e('th', { className: 'p-3' }, 'Status'),
                      e('th', { className: 'p-3' }, 'Anggota'),
                      e('th', { className: 'p-3' }, 'Pekerjaan'),
                      isAdmin && e('th', { className: 'p-3 pr-4 text-center' }, 'Aksi')
                    )
                  ),
                  e('tbody', { className: 'divide-y divide-slate-100' },
                    filteredWarga.map(w => e('tr', { key: w.id, className: 'hover:bg-slate-50/60' },
                      e('td', { className: 'p-3 pl-4' },
                        e('div', { className: 'font-semibold text-slate-900' }, w.nama),
                        e('div', { className: 'text-[10px] text-slate-400 font-mono' }, w.nik)
                      ),
                      e('td', { className: 'p-3 font-semibold text-emerald-600' }, w.blok),
                      e('td', { className: 'p-3 font-mono text-[11px]' }, w.hp),
                      e('td', { className: 'p-3' },
                        e('span', { className: `px-2 py-0.5 rounded text-[10px] font-semibold border ${w.status==='Tetap'?'bg-slate-100 text-slate-700 border-slate-200':'bg-amber-50 text-amber-700 border-amber-200'}` }, w.status)
                      ),
                      e('td', { className: 'p-3' }, `${w.anggota} Orang`),
                      e('td', { className: 'p-3 text-slate-500' }, w.pekerjaan || '-'),
                      isAdmin && e('td', { className: 'p-3 pr-4 text-center' },
                        e('button', {
                          onClick: () => handleDeleteWarga(w.id),
                          className: 'px-2 py-1 text-[10px] font-bold text-rose-600 hover:bg-rose-50 rounded'
                        }, 'Hapus')
                      )
                    ))
                  )
                )
              )
            )
          ),

          // TAB: KAS
          activeTab === 'kas' && e('div', { className: 'space-y-4' },
            e('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-4' },
              e('div', { className: 'p-4 rounded-2xl bg-white border border-slate-200/80 shadow-xs' },
                e('p', { className: 'text-xs text-slate-400 font-medium' }, 'Pemasukan Kas'),
                e('p', { className: 'text-lg font-bold text-emerald-600 mt-1' }, formatRupiah(totalMasuk))
              ),
              e('div', { className: 'p-4 rounded-2xl bg-white border border-slate-200/80 shadow-xs' },
                e('p', { className: 'text-xs text-slate-400 font-medium' }, 'Pengeluaran Kas'),
                e('p', { className: 'text-lg font-bold text-rose-600 mt-1' }, formatRupiah(totalKeluar))
              ),
              e('div', { className: 'p-4 rounded-2xl bg-white border border-slate-200/80 shadow-xs' },
                e('p', { className: 'text-xs text-slate-400 font-medium' }, 'Saldo Bersih Kas'),
                e('p', { className: 'text-lg font-bold text-slate-900 mt-1' }, formatRupiah(saldoKas))
              )
            ),

            e('div', { className: 'bg-white rounded-2xl border border-slate-200/90 overflow-hidden shadow-xs' },
              e('div', { className: 'p-4 border-b border-slate-100 font-semibold text-xs text-slate-800' }, 'Riwayat Arus Transaksi Kas'),
              e('div', { className: 'overflow-x-auto' },
                e('table', { className: 'w-full text-left text-xs border-collapse' },
                  e('thead', { className: 'bg-slate-50 border-b border-slate-200 text-slate-500 uppercase text-[10px]' },
                    e('tr', null,
                      e('th', { className: 'p-3 pl-4' }, 'Tanggal'),
                      e('th', { className: 'p-3' }, 'Jenis'),
                      e('th', { className: 'p-3' }, 'Kategori'),
                      e('th', { className: 'p-3' }, 'Keterangan'),
                      e('th', { className: 'p-3 text-right pr-4' }, 'Nominal')
                    )
                  ),
                  e('tbody', { className: 'divide-y divide-slate-100' },
                    kas.map(k => e('tr', { key: k.id, className: 'hover:bg-slate-50/50' },
                      e('td', { className: 'p-3 pl-4 text-slate-400' }, k.tanggal),
                      e('td', { className: 'p-3' },
                        e('span', { className: `px-2 py-0.5 rounded text-[10px] font-bold border ${k.jenis==='Masuk'?'bg-emerald-50 text-emerald-700 border-emerald-200':'bg-rose-50 text-rose-700 border-rose-200'}` }, k.jenis)
                      ),
                      e('td', { className: 'p-3 font-medium' }, k.kategori),
                      e('td', { className: 'p-3 text-slate-500' }, k.keterangan),
                      e('td', { className: `p-3 text-right pr-4 font-bold ${k.jenis==='Masuk'?'text-emerald-600':'text-rose-600'}` },
                        `${k.jenis==='Masuk'?'+':'-'} ${formatRupiah(k.nominal)}`
                      )
                    ))
                  )
                )
              )
            )
          ),

          // TAB: KEGIATAN
          activeTab === 'kegiatan' && e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
            kegiatan.map(k => e('div', { key: k.id, className: 'bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs space-y-2' },
              e('span', { className: 'text-[10px] bg-emerald-50 text-emerald-700 px-2.5 py-0.5 rounded-md font-semibold border border-emerald-200' }, k.status),
              e('h4', { className: 'font-semibold text-sm text-slate-900' }, k.nama),
              e('div', { className: 'text-xs text-slate-500 space-y-1' },
                e('p', null, `📅 ${k.tanggal} (${k.waktu})`),
                e('p', null, `📍 Lokasi: ${k.lokasi}`),
                e('p', null, `👤 Penanggung Jawab: ${k.pj}`)
              )
            ))
          ),

          // TAB: PENGUMUMAN
          activeTab === 'info' && e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
            info.map(i => e('div', { key: i.id, className: 'bg-white p-5 rounded-2xl border border-slate-200/80 shadow-xs space-y-2' },
              e('div', { className: 'flex justify-between items-center' },
                e('span', { className: 'text-[10px] bg-amber-50 text-amber-700 px-2 py-0.5 rounded font-bold border border-amber-200' }, i.prioritas),
                e('span', { className: 'text-[11px] text-slate-400' }, i.tanggal)
              ),
              e('h4', { className: 'font-semibold text-sm text-slate-900' }, i.judul),
              e('p', { className: 'text-xs text-slate-500 leading-relaxed' }, i.isi)
            ))
          ),

          // TAB: HELPDESK / PENGADUAN
          activeTab === 'pengaduan' && e('div', { className: 'space-y-3' },
            pengaduan.map(p => e('div', { key: p.id, className: 'bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs space-y-2' },
              e('div', { className: 'flex justify-between items-center text-xs' },
                e('span', { className: 'font-semibold text-slate-900' }, p.pelapor),
                e('span', { className: 'px-2 py-0.5 rounded text-[10px] font-semibold bg-sky-50 text-sky-700 border border-sky-200' }, p.status)
              ),
              e('h5', { className: 'font-semibold text-xs text-slate-800' }, p.judul),
              p.respon && e('p', { className: 'text-xs text-emerald-700 bg-emerald-50 p-2.5 rounded-xl border border-emerald-100' }, `Respon RT: ${p.respon}`)
            ))
          ),

          // TAB: KONTAK DARURAT
          activeTab === 'darurat' && e('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
            darurat.map(c => e('div', { key: c.id, className: 'bg-white p-4 rounded-2xl border border-slate-200/80 shadow-xs flex justify-between items-center' },
              e('div', null,
                e('h4', { className: 'font-semibold text-xs text-slate-900' }, c.nama),
                e('p', { className: 'text-[11px] text-slate-400' }, c.deskripsi),
                e('p', { className: 'text-xs font-mono font-bold text-emerald-600 mt-1' }, `📞 ${c.hp}`)
              ),
              e('a', { href: `tel:${c.hp}`, className: 'px-3 py-1.5 bg-slate-900 text-white font-semibold text-xs rounded-xl hover:bg-slate-800 transition' }, 'Hubungi')
            ))
          )
        ),

        // MODAL TAMBAH WARGA
        showModalWarga && e('div', { className: 'fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/40 backdrop-blur-xs' },
          e('div', { className: 'bg-white w-full max-w-md rounded-2xl border border-slate-200 shadow-xl p-5 space-y-4' },
            e('h3', { className: 'font-bold text-sm text-slate-900' }, 'Tambah Warga Baru'),
            e('form', { onSubmit: handleAddWarga, className: 'space-y-3 text-xs' },
              e('div', null,
                e('label', { className: 'block font-semibold text-slate-600 mb-1' }, 'Nama Lengkap'),
                e('input', { required: true, type: 'text', value: formWarga.nama, onChange: (ev)=>setFormWarga({...formWarga, nama: ev.target.value}), className: 'w-full px-3 py-1.5 border rounded-xl' })
              ),
              e('div', { className: 'grid grid-cols-2 gap-3' },
                e('div', null,
                  e('label', { className: 'block font-semibold text-slate-600 mb-1' }, 'NIK (16 Digit)'),
                  e('input', { required: true, type: 'text', value: formWarga.nik, onChange: (ev)=>setFormWarga({...formWarga, nik: ev.target.value}), className: 'w-full px-3 py-1.5 border rounded-xl font-mono' })
                ),
                e('div', null,
                  e('label', { className: 'block font-semibold text-slate-600 mb-1' }, 'Blok / No. Rumah'),
                  e('input', { required: true, type: 'text', value: formWarga.blok, onChange: (ev)=>setFormWarga({...formWarga, blok: ev.target.value}), className: 'w-full px-3 py-1.5 border rounded-xl' })
                )
              ),
              e('div', { className: 'grid grid-cols-2 gap-3' },
                e('div', null,
                  e('label', { className: 'block font-semibold text-slate-600 mb-1' }, 'No. WhatsApp'),
                  e('input', { required: true, type: 'text', value: formWarga.hp, onChange: (ev)=>setFormWarga({...formWarga, hp: ev.target.value}), className: 'w-full px-3 py-1.5 border rounded-xl font-mono' })
                ),
                e('div', null,
                  e('label', { className: 'block font-semibold text-slate-600 mb-1' }, 'Status Huni'),
                  e('select', { value: formWarga.status, onChange: (ev)=>setFormWarga({...formWarga, status: ev.target.value}), className: 'w-full px-3 py-1.5 border rounded-xl' },
                    e('option', { value: 'Tetap' }, 'Tetap'),
                    e('option', { value: 'Kontrak' }, 'Kontrak')
                  )
                )
              ),
              e('div', { className: 'flex justify-end space-x-2 pt-2' },
                e('button', { type: 'button', onClick: ()=>setShowModalWarga(false), className: 'px-3 py-1.5 bg-slate-100 text-slate-600 rounded-xl font-semibold' }, 'Batal'),
                e('button', { type: 'submit', className: 'px-4 py-1.5 bg-emerald-600 text-white rounded-xl font-semibold' }, 'Simpan Data')
              )
            )
          )
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>
