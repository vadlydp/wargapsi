<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WargaKita Pro - Sistem Informasi RT/RW Digital</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React-DOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel for JSX compilation in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    
const { useState } = React;

const INITIAL_WARGA = [
  { id: 1, noRumah: "A-01", nama: "Budi Santoso", status: "Tetap", telepon: "081234567890", anggota: 4, pekerjaan: "PNS", nik: "3171010101900001" },
  { id: 2, noRumah: "A-02", nama: "Siti Rahmawati", status: "Tetap", telepon: "081298765432", anggota: 3, pekerjaan: "Wiraswasta", nik: "3171010101900002" },
  { id: 3, noRumah: "B-01", nama: "Ahmad Dahlan", status: "Kontrak", telepon: "085678901234", anggota: 2, pekerjaan: "Karyawan Swasta", nik: "3171010101900003" },
  { id: 4, noRumah: "B-02", nama: "Dewi Lestari", status: "Tetap", telepon: "087812345678", anggota: 5, pekerjaan: "Guru", nik: "3171010101900004" },
];

const INITIAL_KAS = [
  { id: 1, tanggal: "2026-11-01", keterangan: "Iuran Bulanan November", tipe: "Masuk", kategori: "Iuran", jumlah: 2500000 },
  { id: 2, tanggal: "2026-11-02", keterangan: "Honor Petugas Kebersihan", tipe: "Keluar", kategori: "Operasional", jumlah: 800000 },
  { id: 3, tanggal: "2026-10-28", keterangan: "Perbaikan Lampu Jalan Blok A", tipe: "Keluar", kategori: "Perbaikan", jumlah: 450000 },
  { id: 4, tanggal: "2026-10-25", keterangan: "Sumbangan Acara Kemerdekaan", tipe: "Masuk", kategori: "Donasi", jumlah: 1200000 },
];

const INITIAL_KEGIATAN = [
  { id: 1, judul: "Kerja Bakti Masal", tanggal: "2026-11-08", waktu: "07:00 - selesai", lokasi: "Lapangan Utama", status: "Mendatang", deskripsi: "Pembersihan saluran air menjelang musim hujan." },
  { id: 2, judul: "Rapat Rutin Bulanan RT", tanggal: "2026-11-15", waktu: "19:30 WIB", lokasi: "Balai Warga", status: "Mendatang", deskripsi: "Pembahasan laporan keuangan & program akhir tahun." },
  { id: 3, judul: "Posyandu Balita & Lansia", tanggal: "2026-10-20", waktu: "08:00 - 11:30", lokasi: "Posyandu RT 03", status: "Selesai", deskripsi: "Pemeriksaan kesehatan gratis dan penimbangan balita." },
];

const INITIAL_INFO = [
  { id: 1, tanggal: "2026-11-01", judul: "Jadwal Pengambilan Sampah Baru", prioritas: "Tinggi", isi: "Pengambilan sampah domestik diubah menjadi hari Senin, Rabu, dan Sabtu pukul 08.00 WIB." },
  { id: 2, tanggal: "2026-10-30", judul: "Himbauan Keamanan Portal Malam", prioritas: "Sedang", isi: "Portal utama akan dikunci otomatis mulai pukul 22:00 WIB. Tamu harap melapor ke Satpam." },
];

const INITIAL_LAPORAN = [
  { id: 1, tanggal: "2026-11-01", warga: "Budi Santoso", rumah: "A-01", judul: "Lampu Penerangan Mati", kategori: "Fasilitas", status: "Diproses", responAdmin: "Petugas PLN/RT dijadwalkan cek malam ini." },
  { id: 2, tanggal: "2026-10-29", warga: "Ahmad Dahlan", rumah: "B-01", judul: "Saluran Air Mampet", kategori: "Lingkungan", status: "Selesai", responAdmin: "Pembersihan sudah dilakukan tim kerja bakti." },
];

const INITIAL_KONTAK = [
  { id: 1, nama: "Pos Satpam Utama", peran: "Keamanan 24 Jam", nomor: "0811-9988-7766" },
  { id: 2, nama: "Ketua RT 03", peran: "Pak Budi", nomor: "0812-3456-7890" },
  { id: 3, nama: "Ambulans / RS Terdekat", peran: "Darurat Medis", nomor: "118 / (021) 555-1234" },
  { id: 4, nama: "Polsek Komando", peran: "Kepolisian", nomor: "110" },
];

function App() {
  const [isAdmin, setIsAdmin] = useState(false);
  const [activeTab, setActiveTab] = useState("dashboard");
  const [wargaList, setWargaList] = useState(INITIAL_WARGA);
  const [kasList, setKasList] = useState(INITIAL_KAS);
  const [kegiatanList, setKegiatanList] = useState(INITIAL_KEGIATAN);
  const [infoList, setInfoList] = useState(INITIAL_INFO);
  const [laporanList, setLaporanList] = useState(INITIAL_LAPORAN);
  const [kontakList, setKontakList] = useState(INITIAL_KONTAK);

  const [searchTerm, setSearchTerm] = useState("");
  const [showWargaModal, setShowWargaModal] = useState(false);
  const [editingWarga, setEditingWarga] = useState(null);
  const [wargaForm, setWargaForm] = useState({ noRumah: "", nama: "", status: "Tetap", telepon: "", anggota: 1, pekerjaan: "", nik: "" });

  const totalMasuk = kasList.filter(k => k.tipe === "Masuk").reduce((acc, c) => acc + c.jumlah, 0);
  const totalKeluar = kasList.filter(k => k.tipe === "Keluar").reduce((acc, c) => acc + c.jumlah, 0);
  const saldoKas = totalMasuk - totalKeluar;

  const filteredWarga = wargaList.filter(w => 
    w.nama.toLowerCase().includes(searchTerm.toLowerCase()) || 
    w.noRumah.toLowerCase().includes(searchTerm.toLowerCase())
  );

  const handleSaveWarga = (e) => {
    e.preventDefault();
    if (editingWarga) {
      setWargaList(wargaList.map(w => w.id === editingWarga.id ? { ...wargaForm, id: w.id } : w));
    } else {
      setWargaList([...wargaList, { ...wargaForm, id: Date.now() }]);
    }
    setShowWargaModal(false);
    setEditingWarga(null);
    setWargaForm({ noRumah: "", nama: "", status: "Tetap", telepon: "", anggota: 1, pekerjaan: "", nik: "" });
  };

  const handleEditWarga = (w) => {
    setEditingWarga(w);
    setWargaForm(w);
    setShowWargaModal(true);
  };

  const handleDeleteWarga = (id) => {
    if (confirm("Apakah Anda yakin ingin menghapus data warga ini?")) {
      setWargaList(wargaList.filter(w => w.id !== id));
    }
  };

  return (
    <div className="min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col md:flex-row">
      {/* Sidebar */}
      <aside className="w-full md:w-64 bg-slate-900 text-slate-300 p-5 flex flex-col justify-between shrink-0">
        <div>
          <div className="flex items-center gap-3 mb-8">
            <div className="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-emerald-900/40">
              W
            </div>
            <div>
              <h1 className="font-bold text-lg text-white tracking-tight">WargaKita <span className="text-xs bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded border border-emerald-500/30 font-medium">PRO</span></h1>
              <p className="text-xs text-slate-400">Perumahan Asri Perdana</p>
            </div>
          </div>

          <nav className="space-y-1">
            {[
              { id: "dashboard", label: "Dashboard", icon: "📊" },
              { id: "warga", label: "Data Warga", icon: "👥" },
              { id: "kas", label: "Kas & Iuran", icon: "💰" },
              { id: "kegiatan", label: "Kegiatan", icon: "📅" },
              { id: "info", label: "Pengumuman", icon: "📢" },
              { id: "laporan", label: "Laporan / Helpdesk", icon: "💬" },
              { id: "kontak", label: "Kontak Darurat", icon: "☎️" },
            ].map(item => (
              <button
                key={item.id}
                onClick={() => setActiveTab(item.id)}
                className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-all ${
                  activeTab === item.id 
                    ? "bg-emerald-600 text-white shadow-sm" 
                    : "hover:bg-slate-800 text-slate-400 hover:text-slate-200"
                }`}
              >
                <span>{item.icon}</span>
                <span>{item.label}</span>
              </button>
            ))}
          </nav>
        </div>

        <div className="mt-8 pt-4 border-t border-slate-800">
          <div className="bg-slate-800/80 p-3 rounded-xl border border-slate-700/60 flex items-center justify-between">
            <div>
              <p className="text-xs text-slate-400 font-medium">Mode Pengakses</p>
              <p className={`text-xs font-bold ${isAdmin ? "text-emerald-400" : "text-slate-200"}`}>
                {isAdmin ? "ADMIN / PENGURUS" : "MODE WARGA"}
              </p>
            </div>
            <button
              onClick={() => setIsAdmin(!isAdmin)}
              className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${isAdmin ? "bg-emerald-600" : "bg-slate-600"}`}
            >
              <span className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${isAdmin ? "translate-x-6" : "translate-x-1"}`} />
            </button>
          </div>
        </div>
      </aside>

      {/* Main Content */}
      <main className="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full overflow-x-hidden">
        {/* Top Header */}
        <header className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8 bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
          <div>
            <h2 className="text-xl font-bold text-slate-900 capitalize">
              {activeTab === "dashboard" && "Ringkasan Eksekutif Perumahan"}
              {activeTab === "warga" && "Kelola Data Kependudukan Warga"}
              {activeTab === "kas" && "Laporan Keuangan & Matriks Iuran"}
              {activeTab === "kegiatan" && "Agenda & Kegiatan Warga"}
              {activeTab === "info" && "Papan Informasi & Pengumuman"}
              {activeTab === "laporan" && "Pusat Pengaduan & Layanan Warga"}
              {activeTab === "kontak" && "Nomor Telepon & Layanan Darurat"}
            </h2>
            <p className="text-xs text-slate-500 mt-0.5">Sistem Pengelolaan Lingkungan RT 03 / RW 08</p>
          </div>
          <div className="flex items-center gap-3">
            <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
              Sistem Aktif
            </span>
          </div>
        </header>

        {/* Dynamic Views */}
        {activeTab === "dashboard" && (
          <div className="space-y-6">
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-xs">
                <p className="text-xs text-slate-500 font-medium">Total Kepala Keluarga</p>
                <h3 className="text-2xl font-extrabold text-slate-900 mt-1">{wargaList.length} <span className="text-sm font-normal text-slate-500">KK</span></h3>
                <p className="text-xs text-emerald-600 mt-2 font-medium">100% Terverifikasi</p>
              </div>
              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-xs">
                <p className="text-xs text-slate-500 font-medium">Saldo Kas RT</p>
                <h3 className="text-2xl font-extrabold text-slate-900 mt-1">Rp {saldoKas.toLocaleString('id-ID')}</h3>
                <p className="text-xs text-slate-500 mt-2 font-medium">Terakhir diperbarui hari ini</p>
              </div>
              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-xs">
                <p className="text-xs text-slate-500 font-medium">Kegiatan Mendatang</p>
                <h3 className="text-2xl font-extrabold text-slate-900 mt-1">{kegiatanList.filter(k => k.status === 'Mendatang').length} <span className="text-sm font-normal text-slate-500">Agenda</span></h3>
                <p className="text-xs text-slate-500 mt-2 font-medium">Siap dilaksanakan</p>
              </div>
              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-xs">
                <p className="text-xs text-slate-500 font-medium">Pengaduan Aktif</p>
                <h3 className="text-2xl font-extrabold text-amber-600 mt-1">{laporanList.filter(l => l.status !== 'Selesai').length} <span className="text-sm font-normal text-slate-500">Laporan</span></h3>
                <p className="text-xs text-amber-600 mt-2 font-medium">Membutuhkan perhatian</p>
              </div>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div className="lg:col-span-2 bg-white p-5 rounded-xl border border-slate-200 shadow-xs">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="font-bold text-slate-900">Pengumuman Terbaru</h3>
                  <button onClick={() => setActiveTab('info')} className="text-xs font-semibold text-emerald-600 hover:underline">Lihat Semua →</button>
                </div>
                <div className="space-y-3">
                  {infoList.map(info => (
                    <div key={info.id} className="p-4 rounded-lg bg-slate-50 border border-slate-200/80">
                      <div className="flex items-center justify-between mb-1">
                        <span className={`text-[10px] font-bold px-2 py-0.5 rounded uppercase ${info.prioritas === 'Tinggi' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}`}>
                          {info.prioritas}
                        </span>
                        <span className="text-xs text-slate-400">{info.tanggal}</span>
                      </div>
                      <h4 className="font-semibold text-slate-800 text-sm">{info.judul}</h4>
                      <p className="text-xs text-slate-600 mt-1">{info.isi}</p>
                    </div>
                  ))}
                </div>
              </div>

              <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-xs">
                <h3 className="font-bold text-slate-900 mb-4">Agenda Terdekat</h3>
                <div className="space-y-3">
                  {kegiatanList.filter(k => k.status === 'Mendatang').map(k => (
                    <div key={k.id} className="p-3.5 rounded-lg border border-slate-200 bg-emerald-50/40">
                      <p className="text-xs font-semibold text-emerald-700">{k.tanggal} • {k.waktu}</p>
                      <h4 className="font-bold text-slate-800 text-sm mt-0.5">{k.judul}</h4>
                      <p className="text-xs text-slate-500 mt-1">📍 {k.lokasi}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        )}

        {/* Data Warga View */}
        {activeTab === "warga" && (
          <div className="bg-white rounded-xl border border-slate-200 shadow-xs p-5">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
              <input
                type="text"
                placeholder="Cari warga berdasarkan nama atau no rumah..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                className="w-full sm:w-80 px-3.5 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
              />
              {isAdmin && (
                <button
                  onClick={() => { setEditingWarga(null); setWargaForm({ noRumah: "", nama: "", status: "Tetap", telepon: "", anggota: 1, pekerjaan: "", nik: "" }); setShowWargaModal(true); }}
                  className="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-xs transition-colors shrink-0"
                >
                  + Tambah Warga
                </button>
              )}
            </div>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-sm">
                <thead className="bg-slate-50 text-slate-600 text-xs uppercase tracking-wider font-semibold border-b border-slate-200">
                  <tr>
                    <th className="p-3">No. Rumah</th>
                    <th className="p-3">Nama Lengkap</th>
                    <th className="p-3">Status</th>
                    <th className="p-3">No. Telepon</th>
                    <th className="p-3">Anggota KK</th>
                    <th className="p-3">Pekerjaan</th>
                    {isAdmin && <th className="p-3 text-right">Aksi Admin</th>}
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-200 text-slate-700">
                  {filteredWarga.map((w) => (
                    <tr key={w.id} className="hover:bg-slate-50/80 transition-colors">
                      <td className="p-3 font-semibold text-slate-900">{w.noRumah}</td>
                      <td className="p-3 font-medium">{w.nama}</td>
                      <td className="p-3">
                        <span className={`px-2 py-0.5 text-xs font-semibold rounded-full ${w.status === 'Tetap' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                          {w.status}
                        </span>
                      </td>
                      <td className="p-3">{w.telepon}</td>
                      <td className="p-3">{w.anggota} Orang</td>
                      <td className="p-3">{w.pekerjaan}</td>
                      {isAdmin && (
                        <td className="p-3 text-right space-x-2">
                          <button onClick={() => handleEditWarga(w)} className="text-xs font-semibold text-blue-600 hover:underline">Edit</button>
                          <button onClick={() => handleDeleteWarga(w.id)} className="text-xs font-semibold text-red-600 hover:underline">Hapus</button>
                        </td>
                      )}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        )}

        {/* Kas & Iuran View */}
        {activeTab === "kas" && (
          <div className="space-y-6">
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="bg-white p-4 rounded-xl border border-slate-200">
                <p className="text-xs text-slate-500 font-medium">Total Pemasukan</p>
                <p className="text-xl font-bold text-emerald-600 mt-1">Rp {totalMasuk.toLocaleString('id-ID')}</p>
              </div>
              <div className="bg-white p-4 rounded-xl border border-slate-200">
                <p className="text-xs text-slate-500 font-medium">Total Pengeluaran</p>
                <p className="text-xl font-bold text-red-600 mt-1">Rp {totalKeluar.toLocaleString('id-ID')}</p>
              </div>
              <div className="bg-white p-4 rounded-xl border border-slate-200">
                <p className="text-xs text-slate-500 font-medium">Saldo Akhir</p>
                <p className="text-xl font-bold text-slate-900 mt-1">Rp {saldoKas.toLocaleString('id-ID')}</p>
              </div>
            </div>

            <div className="bg-white rounded-xl border border-slate-200 shadow-xs p-5">
              <h3 className="font-bold text-slate-900 mb-4">Riwayat Transaksi Kas</h3>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-sm">
                  <thead className="bg-slate-50 text-slate-600 text-xs uppercase tracking-wider font-semibold border-b border-slate-200">
                    <tr>
                      <th className="p-3">Tanggal</th>
                      <th className="p-3">Keterangan</th>
                      <th className="p-3">Kategori</th>
                      <th className="p-3 text-right">Jumlah</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-200">
                    {kasList.map((k) => (
                      <tr key={k.id} className="hover:bg-slate-50/80">
                        <td className="p-3 text-slate-500 text-xs">{k.tanggal}</td>
                        <td className="p-3 font-medium text-slate-800">{k.keterangan}</td>
                        <td className="p-3"><span className="px-2 py-0.5 rounded bg-slate-100 text-slate-600 text-xs">{k.kategori}</span></td>
                        <td className={`p-3 text-right font-bold ${k.tipe === 'Masuk' ? 'text-emerald-600' : 'text-red-600'}`}>
                          {k.tipe === 'Masuk' ? '+' : '-'} Rp {k.jumlah.toLocaleString('id-ID')}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        )}

        {/* Other Tabs Placeholder Simple */}
        {activeTab === "kegiatan" && (
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {kegiatanList.map(k => (
              <div key={k.id} className="bg-white p-5 rounded-xl border border-slate-200 shadow-xs">
                <span className={`text-xs font-semibold px-2 py-0.5 rounded ${k.status === 'Mendatang' ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'}`}>
                  {k.status}
                </span>
                <h3 className="font-bold text-slate-900 text-lg mt-2">{k.judul}</h3>
                <p className="text-xs text-slate-500 mt-1">🗓️ {k.tanggal} ({k.waktu})</p>
                <p className="text-xs text-slate-500">📍 {k.lokasi}</p>
                <p className="text-sm text-slate-600 mt-3">{k.deskripsi}</p>
              </div>
            ))}
          </div>
        )}

        {activeTab === "info" && (
          <div className="space-y-4">
            {infoList.map(i => (
              <div key={i.id} className="bg-white p-5 rounded-xl border border-slate-200 shadow-xs">
                <div className="flex items-center justify-between">
                  <span className="text-xs font-bold uppercase text-red-600 bg-red-50 px-2 py-0.5 rounded border border-red-200">{i.prioritas}</span>
                  <span className="text-xs text-slate-400">{i.tanggal}</span>
                </div>
                <h3 className="font-bold text-slate-900 text-lg mt-2">{i.judul}</h3>
                <p className="text-sm text-slate-600 mt-2 leading-relaxed">{i.isi}</p>
              </div>
            ))}
          </div>
        )}

        {activeTab === "laporan" && (
          <div className="bg-white rounded-xl border border-slate-200 shadow-xs p-5 space-y-4">
            <h3 className="font-bold text-slate-900">Daftar Pengaduan Warga</h3>
            {laporanList.map(l => (
              <div key={l.id} className="p-4 rounded-lg border border-slate-200 bg-slate-50/50 flex justify-between items-start">
                <div>
                  <span className={`text-xs font-semibold px-2 py-0.5 rounded ${l.status === 'Selesai' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                    {l.status}
                  </span>
                  <h4 className="font-bold text-slate-800 mt-1">{l.judul}</h4>
                  <p className="text-xs text-slate-500">Pelapor: {l.warga} (Rumah {l.rumah}) • {l.tanggal}</p>
                  {l.responAdmin && <p className="text-xs text-emerald-700 mt-2 font-medium bg-emerald-50 p-2 rounded">Respon RT: {l.responAdmin}</p>}
                </div>
              </div>
            ))}
          </div>
        )}

        {activeTab === "kontak" && (
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
            {kontakList.map(c => (
              <div key={c.id} className="bg-white p-5 rounded-xl border border-slate-200 shadow-xs flex justify-between items-center">
                <div>
                  <h3 className="font-bold text-slate-900">{c.nama}</h3>
                  <p className="text-xs text-slate-500">{c.peran}</p>
                </div>
                <a href={`tel:${c.nomor}`} className="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition-colors">
                  📞 {c.nomor}
                </a>
              </div>
            ))}
          </div>
        )}
      </main>

      {/* Modal Input/Edit Warga */}
      {showWargaModal && (
        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
            <h3 className="font-bold text-lg text-slate-900 mb-4">{editingWarga ? "Edit Data Warga" : "Tambah Warga Baru"}</h3>
            <form onSubmit={handleSaveWarga} className="space-y-4">
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">No. Rumah</label>
                <input type="text" required value={wargaForm.noRumah} onChange={e => setWargaForm({...wargaForm, noRumah: e.target.value})} className="w-full px-3 py-2 rounded-lg border text-sm" placeholder="Contoh: A-05" />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap</label>
                <input type="text" required value={wargaForm.nama} onChange={e => setWargaForm({...wargaForm, nama: e.target.value})} className="w-full px-3 py-2 rounded-lg border text-sm" placeholder="Nama Warga" />
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Status Warga</label>
                  <select value={wargaForm.status} onChange={e => setWargaForm({...wargaForm, status: e.target.value})} className="w-full px-3 py-2 rounded-lg border text-sm">
                    <option value="Tetap">Tetap</option>
                    <option value="Kontrak">Kontrak</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-700 mb-1">Jumlah Anggota</label>
                  <input type="number" min="1" value={wargaForm.anggota} onChange={e => setWargaForm({...wargaForm, anggota: parseInt(e.target.value)})} className="w-full px-3 py-2 rounded-lg border text-sm" />
                </div>
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">No. Telepon / Whatsapp</label>
                <input type="text" value={wargaForm.telepon} onChange={e => setWargaForm({...wargaForm, telepon: e.target.value})} className="w-full px-3 py-2 rounded-lg border text-sm" placeholder="0812..." />
              </div>
              <div>
                <label className="block text-xs font-semibold text-slate-700 mb-1">Pekerjaan</label>
                <input type="text" value={wargaForm.pekerjaan} onChange={e => setWargaForm({...wargaForm, pekerjaan: e.target.value})} className="w-full px-3 py-2 rounded-lg border text-sm" placeholder="Pekerjaan / Profesi" />
              </div>
              <div className="flex justify-end gap-2 pt-3">
                <button type="button" onClick={() => setShowWargaModal(false)} className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg">Batal</button>
                <button type="submit" className="px-4 py-2 text-xs font-semibold bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">Simpan Data</button>
              </div>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
</body>
</html>
